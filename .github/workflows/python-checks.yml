name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_db
      RAG_API_KEY: test-secret
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -c "from app.main import app; assert app.title"
      - name: Check routing helpers
        run: |
          python - <<'PY'
          from app.services.document_routing_service import infer_subject, _is_underspecified

          assert infer_subject("دليل المعلم رياضيات صف 12") == "الرياضيات"
          assert infer_subject("أمن المعلومات والتشفير") == "أمن المعلومات"
          assert _is_underspecified("اشرحلي الدرس الأول") is True
          assert _is_underspecified("اشرحلي المتتاليات") is False
          PY
