name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rag_user:rag_password@localhost:5432/rag_db
      RAG_API_KEY: test-secret
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -c "from app.main import app; assert app.title"
      - name: Check routing helpers
        run: |
          python - <<'PY'
          from app.services.document_routing_service import infer_subject, _is_underspecified

          assert infer_subject("دليل المعلم رياضيات صف 12") == "الرياضيات"
          assert infer_subject("أمن المعلومات والتشفير") == "أمن المعلومات"
          assert _is_underspecified("اشرحلي الدرس الأول") is True
          assert _is_underspecified("اشرحلي المتتاليات") is False
          PY
      - name: Check hybrid chat routing
        run: |
          python - <<'PY'
          from app.api.chat_v5 import CURRICULUM, GENERAL_CHAT, _curriculum_fallback, _fallback_intent
          from app.main import app

          assert _fallback_intent("مرحبا", []) == GENERAL_CHAT
          assert _fallback_intent("اشرح قانون نيوتن الثاني", []) == CURRICULUM
          assert _fallback_intent("حل 2+2", []) == CURRICULUM

          fallback = _curriculum_fallback("اشرحلي الفيزياء")
          assert "مفهرسة" not in fallback
          assert "RAG" not in fallback

          ask_routes = [
              route
              for route in app.routes
              if getattr(route, "path", None) == "/api/chat/ask"
              and "POST" in (getattr(route, "methods", set()) or set())
          ]
          stream_routes = [
              route
              for route in app.routes
              if getattr(route, "path", None) == "/api/chat/stream"
              and "POST" in (getattr(route, "methods", set()) or set())
          ]
          route_debug = [
              (getattr(route, "path", None), sorted(getattr(route, "methods", set()) or set()), getattr(route, "name", None))
              for route in app.routes
          ]
          assert len(ask_routes) == 1, f"ask route count={len(ask_routes)} routes={route_debug}"
          assert len(stream_routes) == 1, f"stream route count={len(stream_routes)} routes={route_debug}"
          PY
